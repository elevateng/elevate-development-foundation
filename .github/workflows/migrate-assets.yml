name: Migrate website assets

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, 'Add local website assets') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download assets from current public host
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://elevate-development-foundation.abiola-adebiyi.chatgpt.site'
          mkdir -p public/images public/reports
          files=(
            images/abiola-8075.webp
            images/community-team.webp
            images/elevate-logo-transparent.png
            images/elevate-logo.png
            images/elevate-session.jpg
            images/elevate-workshop.jpg
            images/empowered-session.webp
            images/empowered-speaker.webp
            images/fiyinfoluwa-adewumi.webp
            images/francess-oyelade.webp
            images/legacy-collage.webp
            images/level-up-0353.webp
            images/level-up-0381.webp
            images/level-up-1330.webp
            images/level-up-1339.webp
            images/level-up-1343.webp
            images/level-up-coaching.webp
            images/level-up-team.webp
            images/level-up-water.webp
            images/makoko-group.webp
            images/makoko-portrait.webp
            images/oluwapelumi-abodunrin.webp
            reports/mental-liberation-2022.pdf
            reports/mentorship-2023-2024.pdf
            reports/project-ace-2021.pdf
          )
          for f in "${files[@]}"; do
            echo "Downloading $f"
            curl --fail --location --retry 3 --retry-delay 2 "$BASE/$f" -o "public/$f"
            test -s "public/$f"
          done
      - name: Commit local assets
        shell: bash
        run: |
          git config user.name 'elevateng'
          git config user.email 'ngelevate@gmail.com'
          git add public/images public/reports
          if git diff --cached --quiet; then
            echo 'Assets already present.'
            exit 0
          fi
          git commit -m 'Add local website assets'
          git push origin main
